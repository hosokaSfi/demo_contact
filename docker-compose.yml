# バックエンド(FastAPI)をDockerで動かすための設定。
# ソースとDBの置き場をホスト側とつないでいるので、編集はすぐ反映され、DBも消えない。

services:
  backend:
    build: ./backend
    ports:
      # パソコン側は8001番、コンテナの中は8000番。
      # 8000番は他のアプリが使っていることがあるので、ここでは8001番にしている。
      - "8001:8000"
    volumes:
      # ソースコード: ホストで編集すると、コンテナ内で自動リロードされる
      - ./backend:/app
      # DBファイル: コンテナを消してもホスト側に残る
      - ./backend/data:/app/data
